[package]
name = "autoshop"
version = "0.26.0"
edition = "2024"
description = "AI-assisted automatic development of RAW photographs (EditRecipe + deterministic Rust render, XMP sidecar, AI denoise)"
license = "MIT"
repository = "https://github.com/skymanbp/autoshop"
readme = "README.md"
# Both binaries are declared explicitly below, so disable auto-discovery of
# src/main.rs + src/bin/*.rs. The GUI is a module tree rooted at
# src/bin/gui/main.rs (round-12 split of the old single-file gui.rs); its
# sibling module files (i18n.rs, model.rs, …) must never be picked up as
# separate binary targets (they have no `main`, so autobins would fail).
autobins = false

# Shared engine library — linked by both front-ends.
[lib]
name = "autoshop"
path = "src/lib.rs"

# CLI front-end (the original binary).
[[bin]]
name = "autoshop"
path = "src/main.rs"

# Native desktop GUI (egui/eframe). Behind the `gui` feature so a plain
# `cargo build` / `cargo test` does NOT pull in eframe + winit + the GL stack;
# build it with `cargo run --features gui --bin autoshop-gui`.
[[bin]]
name = "autoshop-gui"
path = "src/bin/gui/main.rs"
required-features = ["gui"]

[features]
# `eframe/persistence` remembers window geometry + our own prefs (last folder,
# view mode, export options) across launches — table stakes for a real app.
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:ab_glyph", "eframe/persistence"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22"
# Zero-copy Vec<[f32;3]> ↔ Vec<f32> casts in the orientation stage (a 61 MP
# portrait RAW otherwise pays three ~732 MB full-frame copies — see orient_f32).
bytemuck = "1"
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15"
# The `serve` session token gating the image URLs (a page the user visits must
# not be able to drive full-resolution decodes). It has to be CSPRNG bytes —
# anything seeded from the clock is guessable, which is the whole attack.
# Already in the tree transitively, so this adds no new dependency.
getrandom = "0.3.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rawler = "0.7.2"
# ICC → sRGB for baked imports (the LR "Edit in…" round-trip exports ProPhoto
# 16-bit TIFFs; treating those pixels as sRGB fed every tone decision wrong
# numbers). Pure Rust — this tree has no C build dependency and keeps none.
qcms = "0.3"
# The develop pipeline's per-pixel stages are row-parallel (rayon was already in
# the tree — rawler's demosaic uses it; this lets OUR serial tail use the same
# pool). Every conversion is per-pixel independent, so outputs stay bit-identical.
rayon = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tiny_http = "0.12.0"
ureq = { version = "2", features = ["json"] }

# --- native GUI (optional; enabled by the `gui` feature) -------------------
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }
# Same version egui pulls in — used to pre-validate a CJK font before handing it
# to egui (egui panics on an unparseable font), so font loading degrades safely.
ab_glyph = { version = "0.2", optional = true }

# Sidecar kill-groups (L11#7): a timeout must reap the sidecar's WHOLE
# process tree, not just the direct child — a launcher's python or a
# GPU-holding torch worker used to survive the kill. Both crates were
# already in Cargo.lock transitively (rawler/ureq pull them), so promoting
# them adds no download and no new supply-chain surface; official bindings
# beat hand-rolled `extern` declarations for a Job Object (user-ratified
# 2026-08-11).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    # CreateJobObjectW's SECURITY_ATTRIBUTES param / the extended limit
    # struct's IO_COUNTERS live behind these two gates.
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Embeds the Windows app icon into the executables (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Same version `image` already locks (0.11.3) — its own TIFF *encoder* cannot
# round-trip an IccProfile tag (probed: written tag reads back None), so the
# ICC regression tests write their TIFF fixture through the tiff crate
# directly, the way Lightroom-style writers produce real profiled TIFFs.
tiff = "0.11"
