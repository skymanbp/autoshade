# Cross-platform build + test verification (R28 Batch-1, user-ruled
# 2026-08-20; test job added by user ruling 2026-08-20 in place of renting
# cloud compute). `build` proves both feature configurations compile on
# Linux/macOS; `test` runs the default-gated suite there — fixture-dependent
# suites are env-gated and skip themselves off this machine, which is what
# made this job possible (the earlier "does NOT run tests" scope note
# predates that gating). README's CI paragraph is updated only after a run
# of each job has actually been observed green — never ahead of evidence.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The doc-drift gate (user ruling 2026-10-02, after a sweep found nine facts
  # the code had moved past): every path, code symbol, link and tier count the
  # living documents name must exist in the tree. Standard library only, so it
  # runs before any compiler is installed; the manual's CLI synopsis is checked
  # by a CLI test in the `test` job below.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: doc drift
        run: python3 scripts/check_doc_drift.py
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      # A45: the repo pins its compiler (`rust-toolchain.toml`), and `rustup`
      # honours that file for every `cargo` call below whatever the action
      # installed (its `toolchain: stable` input only exists because a commit
      # ref cannot name a channel the way `@stable` did). Asserted rather than
      # assumed — an unpinned runner building the published binaries is
      # exactly the drift the pin exists to end.
      - name: Toolchain
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml pins $want; rustc reports $got"
          test "$want" = "$got" || { echo "::error::the pin was not honoured"; exit 1; }
      - name: cargo build (default features)
        run: cargo build --release --locked
      - name: cargo build (gui feature)
        run: cargo build --release --locked --bins --features gui
  # Release profile: the canonical battery mode — what every local gate runs
  # and what ships. The debug-mode trip these jobs used to run took the
  # renderer's arithmetic-heavy suites to 2h26m on a 4-vCPU runner (run
  # 33294497854) while the same release-mode suite finishes in minutes; it
  # also tested a binary in a profile nothing ever ships. debug_assert!
  # coverage lives in the dedicated job below instead.
  #
  # Eight shards per runner kind since v1.18.0 (`scripts/ci_test_shard.sh`):
  # the new solver's toy fits took one runner past three hours on the library
  # alone (run 43119864352, cancelled unfinished at 3 h 23 min; v1.17.1's
  # whole job was 31 minutes) and a job is cut off at six. Every library test
  # is in exactly one shard; shard 0 also runs the CLI's tests, the contract
  # tests and the doc tests, and the GUI bin's. Nothing is skipped.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - name: Toolchain
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml pins $want; rustc reports $got"
          test "$want" = "$got" || { echo "::error::the pin was not honoured"; exit 1; }
      # One cache per runner kind, shared by its shards: they build the same
      # test programs, and a cache per shard would be eight copies of one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-release
      - name: cargo test (default features), shard ${{ matrix.shard }} of 8
        shell: bash
        run: bash scripts/ci_test_shard.sh ${{ matrix.shard }} 8 all --release
      # The gui feature only adds dependencies (Cargo.toml [features]; no
      # cfg(feature = "gui") outside src/bin/gui), so this trip runs the GUI
      # bin's own tests only — lib/CLI/contract suites are the default trip's.
      - name: cargo test (gui feature)
        if: matrix.shard == 0
        run: cargo test --locked --release --features gui --bin autoshade-gui

  # fit/render carry debug_assert!s that only fire with debug assertions on — a
  # debug lib trip caught four such reds at step 10-B1 — so one such trip on
  # the cheapest runner keeps that class covered per push while the jobs
  # above stay in the profile that ships. Since 2026-09-11 the `test` profile
  # compiles at opt-level 2 (Cargo.toml `[profile.test]`), which keeps
  # debug-assertions and overflow-checks ON — so this trip still fires them,
  # only faster. Eight shards, as above (the library alone: `lib`).
  debug-asserts:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - name: Toolchain
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml pins $want; rustc reports $got"
          test "$want" = "$got" || { echo "::error::the pin was not honoured"; exit 1; }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-debug
      - name: cargo test (lib, debug profile), shard ${{ matrix.shard }} of 8
        shell: bash
        run: bash scripts/ci_test_shard.sh ${{ matrix.shard }} 8 lib
