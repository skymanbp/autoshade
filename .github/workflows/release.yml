# Release chain (Mac port M0 — design book `task-mac-port.md`, user ruling
# 2026-08-29: the release workflow lands in the close-out step).
#
# `build.yml` stays the per-push sentinel; this is what a TAG runs, and it exists
# to make every published asset reproducible from the tag. That is the promise
# made on issue #2 after Windows Defender flagged a locally built exe: a binary
# anyone can rebuild from a public runner is a claim a reporter can check, and a
# binary built on one laptop is not.
#
# Runner images are pinned, never `-latest`: `macos-latest` moves between major
# macOS versions, and a release whose build host changes underneath it is not
# reproducible in the sense this file is here to provide.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.0) — must match Cargo.toml'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A45: the repo pins its compiler (`rust-toolchain.toml`), and `rustup`
      # honours that file for every `cargo` call below without a toolchain
      # input. Asserted rather than assumed — an unpinned runner building the
      # published binaries is exactly the drift the pin exists to end.
      - name: Toolchain
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml pins $want; rustc reports $got"
          test "$want" = "$got" || { echo "::error::the pin was not honoured"; exit 1; }
      - name: Resolve the version
        id: ver
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: cargo build (default features)
        shell: bash
        run: cargo build --release --locked 2>&1 | tee build-cli.log
      - name: cargo build (gui feature)
        shell: bash
        run: cargo build --release --locked --bins --features gui 2>&1 | tee build-gui.log
      # build.rs turns an icon-embedding failure into a `cargo:warning`, not an
      # error, so a runner missing the resource toolchain would ship an
      # icon-less exe in silence. The local chain never needed this check
      # because the toolchain was always there; a hosted runner is not a
      # machine anyone inspects afterwards.
      - name: The icon really was embedded
        shell: bash
        run: |
          if grep -i "cargo:warning" build-cli.log build-gui.log; then
            echo "::error::the build warned — the icon may not be embedded"; exit 1
          fi
      - name: Stage dist/
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/autoshade.exe dist/
          cp target/release/autoshade-gui.exe dist/
          ./dist/autoshade.exe --version
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build_installer.ps1 -ExpectedVersion '${{ steps.ver.outputs.version }}'
      - name: Build the portable archive
        shell: pwsh
        run: ./scripts/build_portable.ps1 -Version '${{ steps.ver.outputs.version }}'
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/autoshade.exe
            dist/autoshade-gui.exe
            dist/autoshade-*-windows-x64.zip
            target/installer/AutoShade-Setup-*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    env:
      # M3 landed in v1.2.0 (the .app is built and inspected below), so this
      # is no longer a promise about a future step: it must stay equal to the
      # bundle's LSMinimumSystemVersion, and "The bundle says what it is"
      # fails the job when it does not.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A45: the repo pins its compiler (`rust-toolchain.toml`), and `rustup`
      # honours that file for every `cargo` call below without a toolchain
      # input. Asserted rather than assumed — an unpinned runner building the
      # published binaries is exactly the drift the pin exists to end.
      - name: Toolchain
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml pins $want; rustc reports $got"
          test "$want" = "$got" || { echo "::error::the pin was not honoured"; exit 1; }
      - name: Resolve the version
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: rustup target add x86_64-apple-darwin
      - name: Build both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t"
            cargo build --release --locked --bins --features gui --target "$t"
          done
      - name: Universal binaries
        run: |
          mkdir -p dist
          for b in autoshade autoshade-gui; do
            lipo -create -output "dist/$b" \
              "target/aarch64-apple-darwin/release/$b" \
              "target/x86_64-apple-darwin/release/$b"
            # lipo output carries no signature, and Apple Silicon refuses to run
            # an unsigned binary at all. Ad-hoc signing is what makes the smoke
            # test below possible; it is not notarisation and is not claimed to be.
            codesign --force --sign - "dist/$b"
            lipo -info "dist/$b"
          done
      - name: Smoke test — arm64 slice
        run: ./dist/autoshade --version
      # The sidecars' own self-test: it loads neither torch nor weights and
      # touches no network, so it is the one piece of the AI path that CAN be
      # proved here — and it is the piece the Mac port changed (the shared
      # `pick_device`). It is not dependency-free, which is what this comment
      # used to claim and what nothing had checked, because the step only runs
      # on a tag and no tag was pushed between the Mac port and v1.2.0: it
      # imports numpy. The runner's system interpreter is externally managed,
      # so the honest way to give it that one package is to bring an
      # interpreter of our own rather than override someone else's manager.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Sidecar self-test
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy
          python3 python/segment.py --self-test
      # Rosetta is not installed on the hosted runners. Reporting that the Intel
      # slice was BUILT BUT NOT EXECUTED is the honest line; silently skipping it
      # would let a broken slice ship as a tested one.
      - name: Smoke test — Intel slice, if Rosetta is present
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./dist/autoshade --version
          else
            echo "INTEL SLICE BUILT BUT NOT EXECUTED — no Rosetta on this runner"
          fi
      # The payload — binaries, sidecars, icon, licence — is assembled by the
      # script, not here, for the reason `build_portable.ps1` exists on the
      # Windows side: a layout written inline in a workflow drifts the first
      # time a runtime file moves, and it drifts silently.
      - name: Build AutoShade.app
        run: ./scripts/build_app_bundle.sh '${{ steps.ver.outputs.version }}'
      # The GUI cannot be launched on a runner, but the bundle can be
      # INSPECTED, and these three are the claims a broken bundle fails:
      # the plist parses, the executable it names is really there and runs, and
      # the deployment target the binaries were built for is the one the plist
      # advertises (claiming a system the binary cannot run on is the one way a
      # bundle fails AFTER Gatekeeper has let it through).
      - name: The bundle says what it is
        run: |
          plutil -lint dist/AutoShade.app/Contents/Info.plist
          exe=$(plutil -extract CFBundleExecutable raw dist/AutoShade.app/Contents/Info.plist)
          test -x "dist/AutoShade.app/Contents/MacOS/$exe"
          "dist/AutoShade.app/Contents/MacOS/autoshade" --version
          test -f dist/AutoShade.app/Contents/Resources/AutoShade.icns
          test -f dist/AutoShade.app/Contents/Resources/python/segment.py
          test ! -e dist/AutoShade.app/Contents/Resources/python/weights
          plist_min=$(plutil -extract LSMinimumSystemVersion raw dist/AutoShade.app/Contents/Info.plist)
          if [ "$plist_min" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
            echo "::error::Info.plist says $plist_min but the build targeted $MACOSX_DEPLOYMENT_TARGET"
            exit 1
          fi
      - name: Archive
        # ditto, not zip: a plain zip drops the extended attributes and the
        # symlink layout a bundle needs, and the copy that comes back out is a
        # directory that no longer launches.
        run: |
          ditto -c -k --keepParent dist/AutoShade.app \
            "AutoShade-${{ steps.ver.outputs.version }}-macos-universal.zip"
      # The second macOS asset, by user ruling (docs/ROADMAP.md, 31 Aug):
      # someone who wants only the command line should not have to download a
      # GUI bundle and reach inside it for the binary. Up to v1.1.0 the macOS
      # asset WAS this shape; M3 replaced it with the .app rather than adding
      # to it, and the ruling on that report item was to ship both.
      #
      # Payload rules come from build_app_bundle.sh, not from a second opinion
      # written here: same universal binary, same sidecar excludes (no
      # multi-gigabyte weights -- those are fetched on first use -- no
      # bytecode, no sidecar tests).
      - name: Stage the standalone CLI
        run: |
          stage="cli-stage/AutoShade-${{ steps.ver.outputs.version }}-macos-cli"
          rm -rf cli-stage && mkdir -p "$stage/python"
          cp dist/autoshade "$stage/"
          /usr/bin/rsync -a \
            --exclude 'weights/' --exclude '__pycache__/' \
            --exclude 'test_*.py' --exclude '*.pyc' \
            python/ "$stage/python/"
          cp -R assets "$stage/assets"
          cp LICENSE README.md "$stage/"
          # The same three claims the bundle makes, on the shape that has no
          # plist to lint: the binary runs, its sidecars came along, and no
          # weights rode in with them.
          "$stage/autoshade" --version
          test -f "$stage/python/segment.py"
          test ! -e "$stage/python/weights"
          echo "sidecars: $(find "$stage/python" -type f | wc -l) files"
      - name: Archive the standalone CLI
        # ditto here too, for the ad-hoc code signature: a plain zip drops the
        # extended attribute it lives in, and Apple silicon refuses to run an
        # unsigned binary at all.
        run: |
          ditto -c -k --keepParent \
            "cli-stage/AutoShade-${{ steps.ver.outputs.version }}-macos-cli" \
            "AutoShade-${{ steps.ver.outputs.version }}-macos-cli.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: AutoShade-*-macos-*.zip
          if-no-files-found: error

  # A42: the third published CLI. `build.yml` has compiled and tested this
  # target since R28 Batch-1, so the binary was known to work on Linux and was
  # simply never shipped — a Linux user had to build from source to run the
  # command line. Same shape as the macOS CLI zip above, same payload rules
  # taken from `build_app_bundle.sh` rather than re-decided here: the binary,
  # the sidecars without their weights, the assets, LICENSE and README.
  #
  # `ubuntu-22.04`, not `ubuntu-latest`, for this file's own rule about
  # reproducibility — and because the oldest supported image is the one whose
  # glibc the widest set of distributions can run.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A45: the repo pins its compiler (`rust-toolchain.toml`), and `rustup`
      # honours that file for every `cargo` call below without a toolchain
      # input. Asserted rather than assumed — an unpinned runner building the
      # published binaries is exactly the drift the pin exists to end.
      - name: Toolchain
        shell: bash
        run: |
          want=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml pins $want; rustc reports $got"
          test "$want" = "$got" || { echo "::error::the pin was not honoured"; exit 1; }
      - name: Resolve the version
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: cargo build (default features)
        run: cargo build --release --locked
      - name: Stage the standalone CLI
        run: |
          stage="cli-stage/AutoShade-${{ steps.ver.outputs.version }}-linux-x64"
          rm -rf cli-stage && mkdir -p "$stage/python"
          cp target/release/autoshade "$stage/"
          rsync -a \
            --exclude 'weights/' --exclude '__pycache__/' \
            --exclude 'test_*.py' --exclude '*.pyc' \
            python/ "$stage/python/"
          cp -R assets "$stage/assets"
          cp LICENSE README.md "$stage/"
          # The same three claims the macOS CLI stage makes: the binary runs,
          # its sidecars came along, and no weights rode in with them.
          "$stage/autoshade" --version
          test -f "$stage/python/segment.py"
          test ! -e "$stage/python/weights"
          echo "sidecars: $(find "$stage/python" -type f | wc -l) files"
      - name: Archive the standalone CLI
        # `zip -y` keeps symlinks as symlinks and preserves the executable bit,
        # which is the whole of what this payload needs (there is no code
        # signature to lose, so ditto's job on macOS has no counterpart here).
        run: |
          cd cli-stage
          zip -q -r -y \
            "../AutoShade-${{ steps.ver.outputs.version }}-linux-x64.zip" \
            "AutoShade-${{ steps.ver.outputs.version }}-linux-x64"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: AutoShade-*-linux-x64.zip
          if-no-files-found: error

  # The battery runs BESIDE the build on its own runner, not after it inside
  # the build job: the serial form recompiled the whole crate from scratch in
  # the debug profile (the dist build is --release --target <triple>, so
  # nothing was reused) and doubled the macOS wall time. Release profile —
  # the canonical battery mode, and the profile the assets above ship in.
  macos-battery:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Batteries
        run: |
          cargo test --locked --release
          cargo test --locked --release --features gui --bin autoshade-gui
      # A49: the Metal path, MEASURED. M2 routed all five sidecars through one
      # `cuda -> mps -> cpu` ladder and v1.2.0 shipped saying the Metal arm was
      # unmeasured — no timing, no memory figure, and no answer to whether
      # `torchvision.ops.deform_conv2d` (which BiRefNet needs, and which Metal
      # has historically not implemented) was quietly running on the CPU under
      # the `PYTORCH_ENABLE_MPS_FALLBACK` the app itself sets. This is the only
      # runner in the chain that HAS Metal, so it is the only place the three
      # questions can be answered. The numbers go into the job summary.
      #
      # The runner's system interpreter is externally managed, so an
      # interpreter of our own is brought rather than someone else's manager
      # overridden — the same reasoning as the sidecar self-test above.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Metal (MPS) measurement
        run: |
          python3 -m pip install --quiet --disable-pip-version-check torch torchvision
          python3 scripts/mps_probe.py

  publish:
    needs: [windows, macos, linux, macos-battery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # NOT `assets`: the checkout above brings the repo's own assets/
          # (fonts, ICC, icons) and the first live run flattened those onto
          # themselves and died. A name the repo does not use, and the
          # flatten reaches only INTO the per-artifact subdirectories.
          path: release-assets
      - name: Flatten, checksum, and print the asset table
        run: |
          find release-assets -mindepth 2 -type f -exec mv -t release-assets/ {} +
          find release-assets -mindepth 1 -type d -empty -delete
          cd release-assets
          : > checksums.txt
          echo "| File | Size | SHA-256 |" > table.md
          echo "|---|---:|---|" >> table.md
          for f in $(ls | grep -v '^checksums.txt$' | grep -v '^table.md$' | sort); do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            size=$(stat -c%s "$f")
            printf '%s  %s\n' "$sha" "$f" >> checksums.txt
            printf '| `%s` | %s bytes | `%s` |\n' "$f" "$size" "$sha" >> table.md
          done
          cat checksums.txt
          echo "--- paste these rows into README.md and the release notes ---"
          cat table.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          rm -f release-assets/table.md
          {
            echo "Built by GitHub Actions from \`${{ github.sha }}\`."
            echo
            echo "Every asset below is reproducible from this tag: $run_url"
            echo
            echo "\`checksums.txt\` carries the SHA-256 of each file."
          } > notes.md
          gh release create "v$v" --title "v$v" --notes-file notes.md release-assets/* \
            || gh release upload "v$v" release-assets/* --clobber
